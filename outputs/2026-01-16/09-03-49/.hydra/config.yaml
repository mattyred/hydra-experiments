task_name: train
tags:
- cifar10
- vit_small
- mcd
- cosine_annealing
train: true
test: true
ckpt_path: /home/rossom/hydra-experiments/logs/train/multiruns/2026-01-14_05-45-18/0/csv/version_0/checkpoints/epoch=199-step=5000.ckpt
seed: 1234
data:
  _target_: src.data.cifar10_datamodule.CIFAR10DataModule
  data_dir: ${paths.data_dir}
  batch_size: 512
  train_subset: 12500
  train_subset_seed: ${seed}
  num_workers: 4
  pin_memory: true
model:
  _target_: src.models.vit_mcd_module.ViTMCDLitModule
  net_config:
    arch: vit_small
    dropout_rate: 0.5
    size: 32
    patch: 4
    dimhead: 512
    in_channels: 3
    num_classes: 10
  optimizer:
    _target_: torch.optim.Adam
    _partial_: true
    lr: 0.0001
    weight_decay: 0.0
  scheduler:
    _target_: torch.optim.lr_scheduler.CosineAnnealingLR
    _partial_: true
    T_max: 200
    eta_min: 0.0
  compile: false
  mcd_samples_train: 10
  mcd_samples_val: 50
  mcd_samples_test: 50
callbacks: {}
logger:
  csv:
    _target_: lightning.pytorch.loggers.csv_logs.CSVLogger
    save_dir: ${paths.output_dir}
    name: csv/
    prefix: ''
  wandb:
    _target_: lightning.pytorch.loggers.wandb.WandbLogger
    save_dir: ${paths.output_dir}
    offline: false
    id: null
    anonymous: null
    project: scaling_laws_of_uncertainty
    log_model: false
    prefix: ''
    group: cifar10_resnet
    tags: ${tags}
    job_type: ''
trainer:
  _target_: lightning.pytorch.trainer.Trainer
  default_root_dir: ${paths.output_dir}
  min_epochs: 200
  max_epochs: 200
  accelerator: gpu
  devices: 1
  precision: bf16-mixed
  check_val_every_n_epoch: 1
  deterministic: false
  strategy: ddp
  num_nodes: 1
  sync_batchnorm: true
  gradient_clip_val: 0
paths:
  root_dir: ${oc.env:PROJECT_ROOT}
  data_dir: ${paths.root_dir}/data/
  log_dir: ${paths.root_dir}/logs/
  output_dir: ${hydra:runtime.output_dir}
  work_dir: ${hydra:runtime.cwd}
extras:
  ignore_warnings: false
  enforce_tags: true
  print_config: true
