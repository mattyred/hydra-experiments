# @package _global_

defaults:
  - cifar10_resnet_mcd
  - override /hydra/launcher: submitit_slurm

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      model.net_config.arch: wideresnet
      model.net_config.wrn_depth: 40
      model.net_config.wrn_width: 4
      model.net_config.dropout_rate: 0.0
      data.train_subset: 12500,25000,37500,50000
      trainer.min_epochs: 100
      trainer.max_epochs: 100
      seed: range(1234, 1244)
